# 80端口强制跳转HTTPS
server {
    listen 80;
    server_name tianxiadiyi.xyz www.tianxiadiyi.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl;
    server_name tianxiadiyi.xyz www.tianxiadiyi.xyz;

    ssl_certificate /etc/nginx/ssl/tianxiadiyi.pem;
    ssl_certificate_key /etc/nginx/ssl/tianxiadiyi.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 批量 PDF 上传；默认 1m 会触发 413 Request Entity Too Large
    client_max_body_size 200m;

    root /var/www/tianxiadiyi/frontend;
    index index_v2.html index.html index.htm;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 200m;

        # 与后端 AI_TIMEOUT_SECONDS=500 对齐；过短会在模型未出首包时 504
        proxy_connect_timeout 75s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index_v2.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
    }
}