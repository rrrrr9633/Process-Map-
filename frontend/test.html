<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 连接测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>🔧 API 连接测试</h1>

    <div class="test-box">
        <h3>测试 1: 健康检查</h3>
        <button onclick="testHealth()">测试 /health</button>
        <div id="health-result"></div>
    </div>

    <div class="test-box">
        <h3>测试 2: 文本生成工序</h3>
        <button onclick="testGenerateFromText()">测试 /process/generate-from-text</button>
        <div id="text-result"></div>
    </div>

    <div class="test-box">
        <h3>测试 3: API 文档</h3>
        <button onclick="window.open('http://localhost:8000/docs', '_blank')">打开 Swagger 文档</button>
        <button onclick="window.open('http://localhost:8000/redoc', '_blank')">打开 ReDoc 文档</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<p>测试中...</p>';

            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="status success">
                        ✅ 连接成功！
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">
                        ❌ 连接失败: ${error.message}
                        <br><br>
                        <strong>可能的原因：</strong>
                        <ul>
                            <li>后端服务未启动</li>
                            <li>端口被占用</li>
                            <li>CORS 配置问题</li>
                        </ul>
                    </div>
                `;
            }
        }

        async function testGenerateFromText() {
            const resultDiv = document.getElementById('text-result');
            resultDiv.innerHTML = '<p>测试中...</p>';

            const testData = {
                text: "零件名称：曲轴\n图号：CS-2024-001\n材料：45钢\n主轴颈直径50mm，公差±0.01\n需要滚压、探伤、退磁",
                mode: "standard_8"
            };

            try {
                const response = await fetch(`${API_BASE}/process/generate-from-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="status success">
                        ✅ API 调用成功！
                        <p><strong>生成工序数：</strong> ${data.process_plan.operations.length}</p>
                        <p><strong>工序标题：</strong> ${data.process_plan.title}</p>
                        <details>
                            <summary>查看完整响应</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">
                        ❌ API 调用失败: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
